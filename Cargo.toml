[package]
name = "swan"
version = "1.0.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
strip = true

[dependencies]
# database migration
migration = { path = "./migration" }

# Backend
axum = {version = "0.8.9", features = ["macros"] }

# Asynchronuous
tokio = {version = "1.52.3", features = ["rt-multi-thread", "macros"]}

# Telegram
teloxide = {version = "0.17.0", features = ["webhooks"]}

# to avoid cross compilation error
openssl = { version = "0.10.80", features = ["vendored"] }

# for api documentation and mocking
utoipa = { version = "5.5.0", features = ["chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

# working with serial data
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Loging and tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

anyhow = "1.0.102"
reqwest = "0.13.4"
dotenvy = "0.15.7"
thiserror = "2.0.18"
chrono = "0.4.45"
uuid = "1.23.3"
tower = "0.5.3"
futures-util = "0.3.32"
axum-client-ip = "1.3.1"
secrecy = "0.10.3"
rig = "0.38.2"
rig-core = "0.38.2"
async-trait = "0.1.89"
sea-orm = { version = "1.1.20", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "chrono", "with-uuid", "uuid"] }
rig-derive = "0.38.2"
