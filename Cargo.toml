[package]
name = "swan"
version = "1.0.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
strip = true

[dependencies]
# Backend
axum = {version = "0.8.9", features = ["macros"] }

# Asynchronuous
tokio = {version = "1.52.3", features = ["rt-multi-thread", "macros"]}

# Telegram
teloxide = {version = "0.17.0", features = ["webhooks"]}

# to avoid cross compilation error
openssl = { version = "0.10.80", features = ["vendored"] }
utoipa = { version = "5.5.0", features = ["chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
anyhow = "1.0.102"
reqwest = "0.13.4"
dotenvy = "0.15.7"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
chrono = "0.4.45"
uuid = "1.23.3"
tower = "0.5.3"
futures-util = "0.3.32"
axum-client-ip = "1.3.1"
secrecy = "0.10.3"
